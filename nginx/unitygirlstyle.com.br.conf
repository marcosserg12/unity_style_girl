# ─── unitygirlstyle.com.br — Frontend Next.js ────────────────────────────────
# Redireciona HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name unitygirlstyle.com.br www.unitygirlstyle.com.br;

    return 301 https://unitygirlstyle.com.br$request_uri;
}

# Redireciona www → sem www (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.unitygirlstyle.com.br;

    ssl_certificate     /etc/letsencrypt/live/unitygirlstyle.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unitygirlstyle.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://unitygirlstyle.com.br$request_uri;
}

# Servidor principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name unitygirlstyle.com.br;

    ssl_certificate     /etc/letsencrypt/live/unitygirlstyle.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unitygirlstyle.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/unitygirlstyle_access.log;
    error_log  /var/log/nginx/unitygirlstyle_error.log;

    # Proxy para Next.js (PM2 roda na porta 3000)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Cache de assets estáticos do Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

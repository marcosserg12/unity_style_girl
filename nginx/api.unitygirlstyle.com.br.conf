# ─── api.unitygirlstyle.com.br — Backend Laravel ────────────────────────────
# Redireciona HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.unitygirlstyle.com.br;

    return 301 https://$host$request_uri;
}

# Servidor principal da API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.unitygirlstyle.com.br;

    ssl_certificate     /etc/letsencrypt/live/api.unitygirlstyle.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.unitygirlstyle.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/unitygirlstyle/backend_laravel/public;
    index index.php;

    # Logs
    access_log /var/log/nginx/api_unitygirlstyle_access.log;
    error_log  /var/log/nginx/api_unitygirlstyle_error.log;

    # Tamanho máximo de upload (imagens de produtos)
    client_max_body_size 20M;

    # Roteamento principal do Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Arquivos PHP via PHP-FPM
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Servir imagens do storage diretamente (sem passar pelo PHP)
    location /storage/ {
        alias /var/www/unitygirlstyle/backend_laravel/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Bloquear acesso a arquivos ocultos
    location ~ /\. {
        deny all;
    }

    # Headers CORS para o frontend
    add_header Access-Control-Allow-Origin  "https://unitygirlstyle.com.br" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Responder preflight OPTIONS sem passar pelo PHP
    if ($request_method = OPTIONS) {
        return 204;
    }
}
